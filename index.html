<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>בקר חימום – ניסוי</title>
<meta name="theme-color" content="#0e1a2b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
/* Layout: one-column phone screen — status bar, the LED control as the hero,
   two readings, connect button, collapsible message log. */
:root{
  --bg:#f3f5f8;
  --surface:#ffffff;
  --surface-2:#e8edf3;
  --border:#d3dbe5;
  --fg:#14202f;
  --fg-muted:#5a6779;
  --accent:#d9642b;          /* heater orange */
  --led:#e5322d;             /* the board's red LED */
  --ok:#1f8a4c;
  --warn:#b7791f;
  --font:'Heebo', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
  --mono: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0b1420;
    --surface:#121f30;
    --surface-2:#1a2a40;
    --border:#2a3d56;
    --fg:#e8eef6;
    --fg-muted:#9cadc3;
    --accent:#f08a4b;
    --led:#ff4b45;
    --ok:#4cc982;
    --warn:#e2b04a;
    color-scheme:dark;
  }
}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;}
body{
  background:var(--bg);
  color:var(--fg);
  font-family:var(--font);
  font-size:16px;
  -webkit-tap-highlight-color:transparent;
}
.app{
  max-width:480px;
  margin:0 auto;
  min-height:100%;
  display:flex;
  flex-direction:column;
  gap:16px;
  padding-block:max(16px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-bottom));
  padding-left:max(16px, env(safe-area-inset-left));
  padding-right:max(16px, env(safe-area-inset-right));
}
header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}
h1{
  font-size:20px;
  font-weight:700;
  margin:0;
  letter-spacing:-.01em;
}
.sub{font-size:13px;color:var(--fg-muted);margin-top:2px;}
.chip{
  display:inline-flex;
  align-items:center;
  gap:7px;
  padding:6px 11px;
  border-radius:999px;
  background:var(--surface-2);
  font-size:13px;
  font-weight:500;
  white-space:nowrap;
}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--fg-muted);}
.chip[data-state="connected"] .dot{background:var(--ok);}
.chip[data-state="connecting"] .dot{background:var(--warn);animation:pulse 1s infinite;}
@keyframes pulse{50%{opacity:.25}}

.banner{
  border-radius:12px;
  padding:12px 14px;
  font-size:14px;
  line-height:1.5;
  background:var(--surface);
  border:1px solid var(--border);
  border-inline-start:4px solid var(--warn);
}

.hero{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:20px;
  padding:26px 20px 22px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:14px;
}
.hero-label{font-size:14px;color:var(--fg-muted);}
.ledbtn{
  width:168px;height:168px;
  border-radius:50%;
  border:none;
  cursor:pointer;
  background:var(--surface-2);
  color:var(--fg);
  font-family:var(--font);
  font-size:20px;
  font-weight:700;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  box-shadow:inset 0 0 0 2px var(--border);
  transition:background .25s, box-shadow .25s, transform .1s;
}
.ledbtn small{font-size:13px;font-weight:400;color:var(--fg-muted);}
.ledbtn:active{transform:scale(.97);}
.ledbtn[data-on="1"]{
  background:var(--led);
  color:#fff;
  box-shadow:0 0 0 6px color-mix(in srgb, var(--led) 25%, transparent), 0 0 42px color-mix(in srgb, var(--led) 55%, transparent);
}
.ledbtn[data-on="1"] small{color:rgba(255,255,255,.85);}
.ledbtn:disabled{cursor:default;opacity:.45;box-shadow:inset 0 0 0 2px var(--border);}
.ledbtn[data-pending="1"]{opacity:.7;}
.ledbtn:focus-visible,.btn:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:3px;}
.hint{font-size:13px;color:var(--fg-muted);text-align:center;min-height:1.4em;}
.hint.err{color:var(--led);}

.readings{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.reading{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:14px;
  padding:14px 16px;
  min-width:0;
}
.reading .k{font-size:13px;color:var(--fg-muted);}
.reading .v{
  font-size:26px;
  font-weight:700;
  margin-top:4px;
  font-variant-numeric:tabular-nums;
  direction:ltr;
  text-align:right;
}
.reading .v small{font-size:14px;font-weight:500;color:var(--fg-muted);}
.reading .note{font-size:12px;color:var(--fg-muted);margin-top:2px;}
.stale .v{opacity:.45;}

.btn{
  appearance:none;
  border:none;
  border-radius:14px;
  padding:15px 18px;
  font-family:var(--font);
  font-size:17px;
  font-weight:600;
  cursor:pointer;
  width:100%;
}
.btn.primary{background:var(--accent);color:#fff;}
.btn.secondary{background:var(--surface-2);color:var(--fg);}
.btn:disabled{opacity:.5;cursor:default;}

details{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:14px;
  padding:4px 14px;
}
summary{
  cursor:pointer;
  padding:10px 0;
  font-size:14px;
  color:var(--fg-muted);
}
#log{
  direction:ltr;
  text-align:left;
  font-family:var(--mono);
  font-size:12px;
  line-height:1.5;
  max-height:220px;
  overflow:auto;
  white-space:pre-wrap;
  word-break:break-all;
  margin:0 0 10px;
  color:var(--fg-muted);
}
.footer{font-size:12px;color:var(--fg-muted);text-align:center;margin-top:auto;}
@media (prefers-reduced-motion: reduce){
  *{animation:none !important;transition:none !important;}
}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&display=swap">
</head>
<body>
<main class="app">
  <header>
    <div>
      <h1>בקר חימום · ניסוי</h1>
      <div class="sub" id="deviceName">לא מחובר לבקר</div>
    </div>
    <span class="chip" id="chip" data-state="disconnected" role="status" aria-live="polite"><span class="dot"></span><span id="chipText">מנותק</span></span>
  </header>

  <div class="banner" id="unsupported" hidden>
    הדפדפן הזה לא תומך בבלוטות'. פתחו את האפליקציה בדפדפן <b>Chrome</b> בטלפון אנדרואיד.
  </div>

  <section class="hero" aria-label="שליטה בנורית">
    <div class="hero-label">הנורית האדומה על הלוח</div>
    <button class="ledbtn" id="ledBtn" data-on="0" disabled>
      <span id="ledBtnText">הדלק</span>
      <small id="ledBtnState">מצב לא ידוע</small>
    </button>
    <div class="hint" id="hint">התחברו לבקר כדי לשלוט בנורית</div>
  </section>

  <section class="readings" id="readings" aria-label="נתונים מהבקר">
    <div class="reading">
      <div class="k">מתח סוללה</div>
      <div class="v" id="bat">—</div>
      <div class="note" id="batNote">&nbsp;</div>
    </div>
    <div class="reading">
      <div class="k">זמן פעולה של הבקר</div>
      <div class="v" id="up">—</div>
      <div class="note" id="lastSeen">&nbsp;</div>
    </div>
  </section>

  <button class="btn primary" id="connectBtn">התחבר לבקר</button>
  <button class="btn secondary" id="installBtn" hidden>התקן כאפליקציה במסך הבית</button>

  <details>
    <summary>יומן הודעות</summary>
    <pre id="log" aria-live="off"></pre>
  </details>

  <div class="footer">Feather 32u4 Bluefruit LE · שם בבלוטות': HeaterTest</div>
</main>
<script src="app.js"></script>
</body>
</html>
